{% set name = "libcst" %}
{% set version = "1.9.0" %}
{% set deselect_tests = " --deselect=test_roundtrip.py::RoundTripTests::test_clean_roundtrip" %}
{% set deselect_tests = 'deselect_tests + " --deselect=test_roundtrip.py::RoundTripTests::test_transform_roundtrip"' %}

# E   AssertionError: self.assertTrue(fixtures.exists(), f"{fixtures} should exist")
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 087b58a9afe076bb08e2d726478e1f16cb928d67ffa9092817e033c335de522a

build:
  number: 0
  script:
    - rm %BUILD_PREFIX%\\.cargo.win\\config  # [win]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-rust
    - setuptools_scm
    - wheel
    - setuptools-scm
  run:
    - python
    - pyyaml >=5.2  # [py<313]
    - pyyaml-ft >=8.0.0  # [py==313]
    - pyyaml >=6.0.3  # [py>313]
    - typing-extensions  # [py<310]
    - typing_extensions  # [py<310]

test:
  imports:
    - libcst
    - libcst._nodes
    - libcst._nodes.tests
    - libcst._parser
    - libcst._parser.conversions
    - libcst._parser.parso
    - libcst._parser.parso.pgen2
    - libcst._parser.parso.python
    - libcst._parser.parso.tests
    - libcst._parser.tests
    - libcst._parser.types
    - libcst._parser.types.tests
    - libcst.codegen
    - libcst.codegen.tests
    - libcst.codemod
    - libcst.codemod.commands
    - libcst.codemod.commands.tests
    - libcst.codemod.tests
    - libcst.codemod.visitors
    - libcst.codemod.visitors.tests
    - libcst.helpers
    - libcst.helpers.tests
    - libcst.matchers
    - libcst.matchers.tests
    - libcst.metadata
    - libcst.metadata.tests
    - libcst.testing
    - libcst.tests
  commands:
    - pip check
    # E   ModuleNotFoundError: No module named 'hypothesmith' -> https://pypi.org/project/hypothesmith/
    - rm ${SP_DIR}/libcst/tests/test_fuzz.py  # [unix]
    - del /f /q %SP_DIR%\libcst\tests\test_fuzz.py  # [win]
    - pytest --pyargs libcst.tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - hypothesis

about:
  home: https://github.com/Instagram/LibCST
  summary: A concrete syntax tree with AST-like properties for Python 3.5, 3.6, 3.7 and 3.8 programs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: |
    A Concrete Syntax Tree (CST) parser and serializer library for Python
  doc_url: https://libcst.readthedocs.io
  dev_url: https://github.com/Instagram/LibCST

extra:
  recipe-maintainers:
    - nehaljwani
    - bollwyvl
